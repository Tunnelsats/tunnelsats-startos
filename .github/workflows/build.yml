name: Build StartOS Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      # Integration branches (e.g. feat/storefront-clearnet-vpn) collect
      # stacked PRs before they reach main; each PR must pass CI first.
      # PR-only on purpose: a push trigger would run the suite twice when
      # the integration branch itself has an open PR to main.
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run complete test suite
        run: npm run test:all

      - name: TypeScript typecheck
        run: npm run check

  build:
    name: Build StartOS Package
    needs: test
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@ead412242eec62379eb68cc84db1155fcade10a8 # master
