name: Build StartOS Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run complete test suite
        run: npm run test:all

      - name: TypeScript typecheck
        run: npm run check

  build:
    name: Build StartOS Package
    needs: test
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@be6d7dc7613bb7a7abe1d2318ba1d233cdef725e # master
