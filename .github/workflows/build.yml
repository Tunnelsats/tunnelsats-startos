name: Build StartOS Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run complete test suite
        run: npm run test:all

      - name: TypeScript typecheck
        run: npm run check

  build:
    name: Build StartOS Package
    needs: test
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@7824e4169ef7dbc7413d076855ea20f2e77be1a2 # master
