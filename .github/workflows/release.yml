name: Release StartOS Package

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/

  build:
    name: Build s9pk packages
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools squashfs-tools-ng jq

      - name: Install start-cli
        run: |
          curl -L -o start-cli https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv1.0.1/start-cli_x86_64-linux
          chmod +x start-cli
          mkdir -p ~/.local/bin
          mv start-cli ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Initialize Developer Key & Workspace
        run: |
          mkdir -p ~/.startos
          if [ -n "${{ secrets.STARTOS_DEVELOPER_KEY }}" ]; then
            echo "${{ secrets.STARTOS_DEVELOPER_KEY }}" > ~/.startos/developer.key.pem
          else
            start-cli init-key
          fi
          start-cli s9pk init-workspace ..

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Pack s9pk
        run: make arch/${{ matrix.arch }}

      - name: Prepare Versioned Package File
        id: version_file
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}
          VER_NUM=${RAW_TAG#v}
          FILENAME="tunnelsats_${VER_NUM}_${{ matrix.arch }}.s9pk"
          mv "tunnelsats_${{ matrix.arch }}.s9pk" "$FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tunnelsats-${{ matrix.arch }}
          path: ${{ steps.version_file.outputs.filename }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install start-cli
        run: |
          curl -L -o start-cli https://github.com/Start9Labs/start-technologies/releases/download/start-cli%2Fv1.0.1/start-cli_x86_64-linux
          chmod +x start-cli
          mkdir -p ~/.local/bin
          mv start-cli ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Extract Tag & Filenames
        id: vars
        run: |
          TAG_RAW=${GITHUB_REF#refs/tags/}
          VER_NUM=${TAG_RAW#v}
          X86_FILE="tunnelsats_${VER_NUM}_x86_64.s9pk"
          ARM_FILE="tunnelsats_${VER_NUM}_aarch64.s9pk"
          echo "tag_raw=$TAG_RAW" >> $GITHUB_OUTPUT
          echo "ver_num=$VER_NUM" >> $GITHUB_OUTPUT
          echo "x86_file=$X86_FILE" >> $GITHUB_OUTPUT
          echo "arm_file=$ARM_FILE" >> $GITHUB_OUTPUT
          
          if [[ "$TAG_RAW" =~ -(beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Checksums
        run: |
          sha256sum "${{ steps.vars.outputs.x86_file }}" "${{ steps.vars.outputs.arm_file }}" > SHA256SUMS
          cat SHA256SUMS

      - name: Import GPG Key & Sign SHA256SUMS
        id: gpg
        if: secrets.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate PGP Detached Signature
        if: steps.gpg.outcome == 'success'
        run: |
          gpg --batch --yes --detach-sign --armor SHA256SUMS
          cat SHA256SUMS.asc
          echo "has_pgp=true" >> $GITHUB_ENV

      - name: Inspect Package commitments
        id: inspect
        run: |
          SIGHASH_X86=$(start-cli s9pk inspect "${{ steps.vars.outputs.x86_file }}" commitment | jq -r .rootSighash)
          SIGHASH_ARM=$(start-cli s9pk inspect "${{ steps.vars.outputs.arm_file }}" commitment | jq -r .rootSighash)
          echo "sighash_x86=$SIGHASH_X86" >> $GITHUB_OUTPUT
          echo "sighash_arm=$SIGHASH_ARM" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${{ steps.vars.outputs.tag_raw }}"
          X86_FILE="${{ steps.vars.outputs.x86_file }}"
          ARM_FILE="${{ steps.vars.outputs.arm_file }}"
          
          HASH_X86=$(sha256sum "$X86_FILE" | awk '{print $1}')
          HASH_ARM=$(sha256sum "$ARM_FILE" | awk '{print $1}')
          
          cat <<EOF > release_notes.md
          # TunnelSats StartOS Release $VERSION

          This release packages TunnelSats for StartOS 0.4.0+.

          ## Pre-built Binaries & Checksums

          You can download the pre-built \`.s9pk\` binaries or build them yourself from source.

          | Platform | Filename | SHA256 Checksum | StartOS Build Signature (rootSighash) |
          |---|---|---|---|
          | **x86_64** | \`$X86_FILE\` | \`$HASH_X86\` | \`${{ steps.inspect.outputs.sighash_x86 }}\` |
          | **aarch64 (ARM64)** | \`$ARM_FILE\` | \`$HASH_ARM\` | \`${{ steps.inspect.outputs.sighash_arm }}\` |

          ## How to Verify Checksums

          1. Download the package file (\`.s9pk\`) and \`SHA256SUMS\`.
          2. Verify checksum integrity:
             \`\`\`bash
             sha256sum -c SHA256SUMS
             \`\`\`
          EOF

          if [ "$has_pgp" = "true" ]; then
            cat <<EOF >> release_notes.md

          ## How to Verify PGP Signature

          1. Download \`SHA256SUMS.asc\`.
          2. Import key and verify signature:
             \`\`\`bash
             gpg --import keys/tunnelsats-release-builder.asc
             gpg --verify SHA256SUMS.asc SHA256SUMS
             \`\`\`
          EOF
          fi

          cat <<EOF >> release_notes.md

          ## How to Verify StartOS Build Signature

          To confirm that the package was signed by the official TunnelSats developer key:
          1. Install \`start-cli\` (from [Start9 Labs](https://github.com/Start9Labs/start-technologies/releases)).
          2. Run commitment inspection:
             \`\`\`bash
             start-cli s9pk inspect <filename.s9pk> commitment
             \`\`\`
          3. Confirm \`rootSighash\` matches the table above.
          EOF

      - name: Prepare Assets List
        id: assets
        run: |
          ASSETS="${{ steps.vars.outputs.x86_file }}
          ${{ steps.vars.outputs.arm_file }}
          SHA256SUMS"
          if [ "$has_pgp" = "true" ]; then
            ASSETS="$ASSETS
          SHA256SUMS.asc"
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$ASSETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish Release Draft
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.assets.outputs.files }}
          body_path: release_notes.md
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
